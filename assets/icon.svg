<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- solhint-mcp plugin icon. Full-bleed: the plugin directory masks its own corner
       radius, so a baked-in radius would show as a notch on a mismatched background.

       The ".sol" letterforms are outlines, not text: an SVG that merely names Menlo
       renders with a substitute font wherever Menlo is absent, at different letter
       widths, which would break the centring below. Converted from Menlo Bold
       (unitsPerEm 2048) at 300px, baseline y=470, the word centred on x=555.

       The dot is drawn rather than set: in a monospace cell "." inks a small square in
       a full-width column, so a typed ".sol" puts its visual mass right of centre even
       when nominally centred. Drawing it centres the inked bounds on the canvas.

       The check is wide and shallow on purpose. A tall tick's right arm rises into the
       "l" — it crossed the letter outright in an earlier draft. This one clears the
       baseline and matches the word's width, so the two read as one stack. -->
  <rect width="1024" height="1024" fill="#1f2430"/>
  <rect x="199" y="424" width="46" height="46" fill="#e8ecf2"/>
